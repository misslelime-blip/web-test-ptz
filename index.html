<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffb7d5">
  <meta name="description" content="A little apology made with love.">
  <title>For You, Baby 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-hearts" aria-hidden="true">
    <span>♡</span><span>♥</span><span>♡</span><span>✦</span><span>♥</span><span>♡</span>
  </div>

  <main class="page">
    <section class="letter-card" aria-live="polite">
      <div class="top-decoration" aria-hidden="true">
        <span class="sparkle">✦</span>
        <div class="mascot">
          <div class="ears"><i></i><i></i></div>
          <div class="face">
            <span class="eye eye-left"></span><span class="eye eye-right"></span>
            <span class="blush blush-left"></span><span class="blush blush-right"></span>
            <span class="mouth">ᴗ</span>
          </div>
          <span class="mascot-heart">♥</span>
        </div>
        <span class="sparkle">✧</span>
      </div>

      <p class="eyebrow" id="step-label">A tiny message for my favourite person</p>
      <h1 id="heading">Hey, my baby… 💗</h1>
      <p class="message" id="message">I made a little something for you. Will you hear me out?</p>

      <div class="progress" aria-label="Conversation progress">
        <span id="progress-fill"></span>
      </div>

      <div class="button-area" id="button-area">
        <button class="btn btn-primary" id="start-btn" type="button">Okay, let's see ♡</button>
      </div>

      <p class="tiny-note" id="tiny-note">Made with a little courage and a lot of love.</p>
    </section>
    <footer>one little website · just for you <span>♡</span></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
